<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roadmap card – List / Path</title>
<style>
  :root {
    --card: #F7FFE0; --glow: rgba(200,241,53,.35); --ink: #0F1108; --mute: #6B7160; --line: #DDE8BC;
    --lime: #C8F135; --lime-d: #8FB300; --todo: #C5CFA3; --chip: #EEF3DA;
    --ease: cubic-bezier(0.65, 0, 0.35, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 12px; background: #fff; color: var(--ink); font-family: ui-sans-serif, system-ui, "Inter", sans-serif; display: flex; justify-content: center; }
  .card { width: 100%; max-width: 420px; background: radial-gradient(120% 60% at 85% 0%, var(--glow), transparent 60%), var(--card); border-radius: 28px; padding: 18px 16px 8px; }
  .head { display: flex; gap: 12px; align-items: center; }
  .logo { width: 44px; height: 44px; border-radius: 14px; background: var(--lime-d); display: grid; place-items: center; flex-shrink: 0; }
  .logo svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
  .title { flex: 1; min-width: 0; }
  .title h2 { margin: 0; font-size: 19px; line-height: 1.2; }
  .title p { margin: 2px 0 0; font-size: 13px; color: var(--mute); }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); position: relative; }
  .seg button { all: unset; cursor: pointer; position: relative; z-index: 1; padding: 6px 11px; font-size: 12px; font-weight: 600; color: var(--mute); border-radius: 999px; transition: color 200ms; }
  .seg button[aria-checked="true"] { color: var(--ink); }
  .seg button:focus-visible { outline: 2px solid var(--lime-d); }
  .seg i { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 999px; background: var(--lime); transition: transform 300ms var(--ease); }
  .seg[data-mode="path"] i { transform: translateX(100%); }
  .bar { height: 8px; border-radius: 8px; background: #fff; margin: 16px 2px 6px; overflow: hidden; border: 1px solid var(--line); }
  .bar b { display: block; height: 100%; width: 0; background: var(--lime-d); border-radius: 8px; transition: width 500ms var(--ease); }
  .bar { position: relative; }
  .bar s { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .55; left: 0; transition: left 500ms var(--ease); }
  .pace { display: flex; align-items: center; gap: 8px; margin: 8px 2px 10px; padding: 7px 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; font-size: 12.5px; font-weight: 600; }
  .pace .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--lime-d); flex-shrink: 0; }
  .pace.behind .dot { background: #E0A100; } .pace.behind { border-color: #F0D58A; background: #FFFBEF; }
  .pace .sub { margin-left: auto; color: var(--mute); font-weight: 500; text-align: right; }
  .view { animation: in 380ms var(--ease) both; }
  .view[hidden] { display: none; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }

  /* list view */
  .phase { border-radius: 16px; }
  .phase > button { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 6px; cursor: pointer; }
  .phase > button:focus-visible { outline: 2px solid var(--lime-d); }
  .num { width: 30px; height: 30px; border-radius: 50%; background: #EEF0F4; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0; transition: background 300ms; }
  .phase.done .num { background: var(--lime-d); color: #fff; }
  .pname { flex: 1; }
  .pname strong { display: block; font-size: 15px; }
  .pname small { font-size: 12px; color: var(--mute); font-weight: 600; }
  .chev { width: 16px; height: 16px; stroke: var(--ink); fill: none; stroke-width: 2; transition: transform 250ms; }
  .phase.open .chev { transform: rotate(180deg); }
  .steps { display: none; padding: 0 6px 10px 48px; }
  .phase.open .steps { display: block; }

  .step { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; cursor: pointer; }
  .step input { position: absolute; opacity: 0; }
  .step .box { width: 20px; height: 20px; border: 1.8px solid var(--todo); border-radius: 7px; display: grid; place-items: center; flex-shrink: 0; transition: background 200ms, border-color 200ms; }
  .step .box svg { width: 12px; height: 12px; fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset 250ms 80ms; }
  .step input:checked + .box { background: var(--lime); border-color: var(--lime-d); }
  .step input:checked + .box svg { stroke-dashoffset: 0; }
  .step input:checked ~ .t { color: var(--mute); text-decoration: line-through; text-decoration-color: var(--todo); }
  .step input:focus-visible + .box { outline: 2px solid var(--lime-d); outline-offset: 2px; }
  .step .t { flex: 1; }
  .step em { font-style: normal; font-size: 12px; color: var(--mute); }

  /* path view */
  .path { width: 100%; display: block; margin-top: 4px; }
  .path text { font-family: inherit; }
  .p-name { font-size: 15px; font-weight: 700; fill: var(--ink); }
  .p-meta { font-size: 11.5px; font-weight: 600; fill: var(--mute); }
  #track { fill: none; stroke: var(--todo); stroke-width: 2; stroke-dasharray: 2 8; stroke-linecap: round; }
  #fill { fill: none; stroke: var(--lime-d); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 700ms var(--ease); }
  #arrow .ah { fill: var(--lime-d); stroke: var(--lime-d); stroke-width: 2; stroke-linejoin: round; }
  .node { cursor: pointer; }
  .node circle { fill: var(--card); stroke: var(--todo); stroke-width: 2.5; transition: fill 300ms, stroke 300ms; }
  .node .tick { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity 300ms; }
  .node.cur circle { stroke: var(--lime-d); stroke-width: 3.5; }
  .node.cur .halo { fill: var(--lime); opacity: .5; stroke: none; animation: halo 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .node.done circle:not(.halo) { fill: var(--lime); stroke: var(--lime-d); }
  .node.done .tick { opacity: 1; }
  .node.sel text.p-name { text-decoration: underline; text-decoration-thickness: 2px; text-decoration-color: var(--lime-d); text-underline-offset: 4px; }
  .node:focus-visible { outline: none; } .node:focus-visible circle:not(.halo) { stroke-width: 4; }
  @keyframes halo { 50% { transform: scale(1.5); opacity: 0; } }
  #track { animation: march 1.4s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -20; } }
  #arrow { transition: transform 700ms var(--ease); }
  #arrow .ah { animation: nudge .9s ease-in-out infinite alternate; }
  @keyframes nudge { to { transform: translateX(3px); } }
  .node .num { font-size: 12px; font-weight: 800; fill: var(--mute); text-anchor: middle; transition: opacity 300ms; pointer-events: none; }
  .node.cur .num { fill: var(--ink); } .node.done .num { opacity: 0; }
  .node { transition: transform 200ms; } .node:hover circle:not(.halo) { stroke: var(--lime-d); }
  .here rect { fill: var(--lime); } .here text { font-size: 10px; font-weight: 800; fill: var(--ink); text-anchor: middle; letter-spacing: .02em; }
  .here { opacity: 0; transform: translateY(4px); transition: opacity 300ms, transform 300ms; pointer-events: none; }
  .node.cur .here { opacity: 1; transform: none; }
  .chip circle { fill: #fff; stroke: var(--line); stroke-width: 1.2; } .chip path { fill: var(--ink); }
  .chips { opacity: .45; transition: opacity 300ms; } .node.cur .chips, .node.done .chips { opacity: 1; }
  .flag.on path { fill: var(--lime-d); }
  .detail { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px 8px; margin: 4px 2px 8px; }
  .detail h3 { margin: 0 0 2px; font-size: 14px; }
  .detail .steps { display: block; padding: 0; }

  /* tools */
  .tools h3 { margin: 18px 6px 6px; font-size: 17px; }
  .tool { display: flex; align-items: center; gap: 10px; padding: 12px 6px; border-top: 1px solid var(--line); }
  .tool div { flex: 1; min-width: 0; } .tool strong { display: block; font-size: 16px; font-weight: 500; } .tool span { font-size: 13.5px; color: var(--mute); }
  .tool svg { width: 18px; height: 18px; stroke: var(--mute); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

      const ang = Math.random() * Math.PI * 2, d = spread * (0.5 + Math.random() * 0.7);
      c.animate([{ transform: 'translate(0,0) rotate(0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(ang) * d}px, ${Math.sin(ang) * d + 20}px) rotate(${Math.random() * 540}deg) scale(.3)`, opacity: 0 }],
        { duration: 800 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => c.remove();
    }
  }
  let prevDone = null, prevAll = false;

  // ---------- pace check ----------
  const DAY = 864e5;
  const q = new URLSearchParams(location.search).get('today');            // ?today=2027-03-01 to demo other dates
  const today = q ? new Date(q + 'T00:00:00') : new Date(new Date().toDateString());
  let deadline = new Date(today.getFullYear(), 6, 17); if (deadline < today) deadline = new Date(today.getFullYear() + 1, 6, 17);
  let start = new Date(store.get('rm-start', null) || today); if (!store.get('rm-start', null)) store.set('rm-start', today.toISOString());
  const perDay = h => h < 1 ? `~${Math.max(1, Math.round(h * 60))} min/day` : `${(Math.round(h * 10) / 10)}h/day`;
  function updatePace(hoursDone, total) {
    const left = total - hoursDone, daysLeft = Math.round((deadline - today) / DAY);
    const span = Math.max(1, deadline - start), frac = Math.min(1, Math.max(0, (today - start) / span));
    const diff = hoursDone - total * frac;                                  // + ahead, - behind
    $('exp').style.left = `calc(${frac * 100}% - 1px)`;
    let txt, sub, behind = false;
    if (left <= 0) { txt = 'Completed'; sub = daysLeft > 0 ? `${daysLeft} days before ${DEADLINE}` : ''; }
    else if (daysLeft <= 0) { txt = 'Past deadline'; sub = `${fmt(left)} left`; behind = true; }
    else if (diff < -1) { txt = `Behind by ${fmt(-diff)}`; sub = `${perDay(left / daysLeft)} to finish · ${daysLeft} days left`; behind = true; }
    else if (diff > 1) { txt = `Ahead by ${fmt(diff)}`; sub = `${perDay(left / daysLeft)} needed · ${daysLeft} days left`; }
    else { txt = 'On track'; sub = `${perDay(left / daysLeft)} needed · ${daysLeft} days left`; }
    $('paceTxt').textContent = txt; $('paceSub').textContent = sub; $('pace').classList.toggle('behind', behind);
  }
  function stepsHTML(p) {
    return PHASES[p].s.map((s, j) => `<label class="step"><input type="checkbox" data-p="${p}" data-s="${j}" ${done.has(p + '-' + j) ? 'checked' : ''}><span class="box">${CHECK}</span><span class="t">${s[0]}</span><em>${fmt(s[1])}</em></label>`).join('');
  }

  function render() {
    const total = PHASES.reduce((a, ph) => a + ph.s.length, 0), hours = PHASES.reduce((a, _, p) => a + hrs(p), 0);
    const pct = Math.round(done.size / total * 100), cur = curIdx();
    if (sel === null) sel = cur;
    $('meta').textContent = `${fmt(hours)} · ${total} steps · ${pct}% · ${DEADLINE}`;
    updatePace(PHASES.reduce((a, ph, p) => a + ph.s.reduce((x, s, j) => x + (done.has(p + '-' + j) ? s[1] : 0), 0), 0), hours);
    $('bar').style.width = pct + '%'; $('bar').parentElement.setAttribute('aria-valuenow', pct);

    // list view (keep open phase)
    $('listView').innerHTML = PHASES.map((ph, p) => `
      <div class="phase ${open === p ? 'open' : ''} ${cnt(p) === ph.s.length ? 'done' : ''}">
        <button data-toggle="${p}" aria-expanded="${open === p}"><span class="num">${p + 1}</span>
          <span class="pname"><strong>${ph.n}</strong><small>${cnt(p)}/${ph.s.length} steps · ${fmt(hrs(p))}</small></span>
          <svg class="chev" viewBox="0 0 16 16"><path d="M3 6l5 5 5-5"/></svg></button>
        <div class="steps">${stepsHTML(p)}</div>
      </div>`).join('');

    // path view
    const nodes = svg.querySelectorAll('.node');
    nodes.forEach((n, p) => {
      n.classList.toggle('done', cnt(p) === PHASES[p].s.length);
      n.classList.toggle('cur', p === cur && cnt(p) < PHASES[p].s.length);
      n.classList.toggle('sel', p === sel);
      n.querySelector('.p-meta').textContent = `${cnt(p)}/${PHASES[p].s.length} steps · ${fmt(hrs(p))}`;
    });
    const P = PHASES.reduce((a, _, p) => a + cnt(p) / PHASES[p].s.length, 0);       // 0..4
    const all = done.size === total;
    const i = Math.min(Math.floor(P), 3), frac = all ? 0 : P - i;
    const pos = all ? L : lens[i] + (lens[i + 1] - lens[i]) * frac;
    fill.style.strokeDashoffset = L - pos;
    const pt = track.getPointAtLength(pos), b = track.getPointAtLength(Math.min(pos + 2, L)), a = track.getPointAtLength(Math.max(pos - 2, 0));
    arrow.style.transform = `translate(${pt.x}px, ${pt.y}px) rotate(${Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI}deg)`;
    $('flag').classList.toggle('on', all);
    const nowDone = PHASES.map((_, p) => cnt(p) === PHASES[p].s.length);
    if (prevDone && mode === 'path') {
      nowDone.forEach((d, p) => { if (d && !prevDone[p]) burst(PTS[p + 1][0], PTS[p + 1][1], 16, 44, ['#C8F135', '#8FB300', '#0F1108']); });
      if (all && !prevAll) setTimeout(() => burst(PTS[5][0], PTS[5][1], 40, 110, ['#C8F135', '#8FB300', '#0F1108', '#fff']), 500);
    }
    prevDone = nowDone; prevAll = all;
    $('detail').innerHTML = `<h3>${sel + 1}. ${PHASES[sel].n} · ${cnt(sel)}/${PHASES[sel].s.length}</h3><div class="steps">${stepsHTML(sel)}</div>`;
    store.set('rm-done', [...done]);
  }

  function setMode(m, animate = true) {
    mode = m; store.set('rm-mode', m);
    $('seg').dataset.mode = m;
    $('seg').querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', b.dataset.mode === m));
    for (const [id, name] of [['listView', 'list'], ['pathView', 'path']]) {
      const el = $(id); el.hidden = name !== m;
      if (animate && name === m) { el.style.animation = 'none'; el.offsetHeight; el.style.animation = ''; }
    }
    if (m === 'path') render();   // re-measure arrow once visible
  }

  document.addEventListener('change', e => {
    const c = e.target.closest('input[data-p]'); if (!c) return;
    const k = c.dataset.p + '-' + c.dataset.s;
    c.checked ? done.add(k) : done.delete(k);
    render();
  });
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-toggle]'); if (t) { const p = +t.dataset.toggle; open = open === p ? -1 : p; render(); return; }
    const n = e.target.closest('.node'); if (n) { sel = +n.dataset.p; render(); }
  });
  document.addEventListener('keydown', e => { const n = e.target.closest?.('.node'); if (n && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); sel = +n.dataset.p; render(); } });
  $('seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.mode); });

  sel = null; render(); setMode(mode, false);
})();
</script>
</body>
</html>
