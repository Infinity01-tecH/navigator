<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navigator Preloader</title>
  <meta name="description" content="Four-box preloader: each box zooms in to show a build list, a source logo rain, a roadmap and a checklist.">
  <style>
    :root {
      --lime: #C8F135;
      --white: #F1EEE6;
      --fade: #B0B0A8;
      --loader-bg: #000;
      --loader-line: #3d3d39;
      --loader-text: var(--white);
      --loader-skeleton: #141413;
      --motion-ease: cubic-bezier(0.65, 0, 0.35, 1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: var(--loader-bg); color: var(--loader-text); }
    .preloader { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding: 16px; }
    .stage { position: relative; width: 100%; max-width: 384px; height: 256px; }
    .grid { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 16px; transition: opacity 500ms ease; }
    .row { display: flex; flex: 1; gap: 16px; min-height: 0; }
    .box { min-width: 0; border: 1.5px solid var(--loader-line); border-radius: 16px; }
    .grid .box { flex: 1 1 0; transition: flex-grow 900ms var(--motion-ease); }
    .stage.is-zoom .grid { opacity: 0; }

    /* zoom panels: sit on top of their grid box, then grow to fill the stage */
    .panel { position: absolute; left: var(--x); top: var(--y); width: calc(50% - 8px); height: calc(50% - 8px); background: var(--loader-bg); opacity: 0; pointer-events: none; overflow: hidden; transition: left 900ms var(--motion-ease), top 900ms var(--motion-ease), width 900ms var(--motion-ease), height 900ms var(--motion-ease), opacity 400ms ease; }
    .panel.tl { --x: 0; --y: 0; }
    .panel.tr { --x: calc(50% + 8px); --y: 0; }
    .panel.bl { --x: 0; --y: calc(50% + 8px); }
    .panel.br { --x: calc(50% + 8px); --y: calc(50% + 8px); }
    .stage[data-zoom="tl"] .panel.tl, .stage[data-zoom="tr"] .panel.tr, .stage[data-zoom="bl"] .panel.bl, .stage[data-zoom="br"] .panel.br { left: 0; top: 0; width: 100%; height: 100%; opacity: 1; }
    .inner { position: absolute; left: 0; top: 0; width: 384px; height: 256px; opacity: 0; transition: opacity 250ms ease; }
    .stage[data-show="tl"] .panel.tl .inner, .stage[data-show="tr"] .panel.tr .inner, .stage[data-show="bl"] .panel.bl .inner, .stage[data-show="br"] .panel.br .inner { opacity: 1; }

    /* top-left: scrolling build list */
    .build-window { position: absolute; top: 24px; right: 32px; bottom: 88px; left: 32px; overflow: hidden; }
    .build-content { display: flex; flex-direction: column; gap: 16px; }
    .skeleton { height: 16px; flex-shrink: 0; border: 1px solid var(--loader-line); border-radius: 6px; background: var(--loader-skeleton); }
    .skeleton:nth-child(5n + 1) { width: 33.333333%; }
    .skeleton:nth-child(5n + 2) { width: 91.666667%; }
    .skeleton:nth-child(5n + 3) { width: 66.666667%; }
    .skeleton:nth-child(5n + 4) { width: 50%; }
    .skeleton:nth-child(5n + 5) { width: 75%; }
    .stage[data-play="tl"] .build-content { animation: build-up 3s linear both; }
    .code-badge { color: var(--lime); border-color: var(--lime); position: absolute; bottom: 24px; left: 16px; display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border: 1px solid var(--loader-line); border-radius: 50%; }
    .nav-logo { width: 26px; height: auto; fill: var(--lime); display: block; }
    @keyframes build-up { from { transform: translateY(0); } to { transform: translateY(-288px); } }

    /* bottom-left: source logo rain */
    #rain { position: absolute; inset: 0; overflow: hidden; }
    .rain-icon { position: absolute; top: 0; width: 36px; height: 36px; fill: currentColor; opacity: 0; will-change: transform, opacity; animation: rain 2200ms cubic-bezier(0.4, 0, 0.6, 1) forwards; }
    @keyframes rain {
      0% { transform: translateY(-40px) scale(0.9); opacity: 0; }
      20% { opacity: 0.85; }
      70% { opacity: 0.85; }
      100% { transform: translateY(270px) scale(1); opacity: 0; }
    }

    /* top-right: roadmap */
    #roadmap-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #rm-track { fill: none; stroke: var(--loader-line); stroke-width: 1.5; stroke-dasharray: 3 7; stroke-linecap: round; }
    #rm-line { fill: none; stroke: var(--lime); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    #rm-arrow { fill: var(--lime); stroke: var(--lime); stroke-width: 2; stroke-linejoin: round; opacity: 0; }
    .rm-node circle { fill: var(--loader-bg); stroke: var(--lime); stroke-width: 1.8; transform-box: fill-box; transform-origin: center; transform: scale(0.3); opacity: 0; transition: transform 350ms var(--motion-ease), opacity 250ms ease; }
    .rm-node .bar { fill: var(--loader-skeleton); stroke: var(--loader-line); stroke-width: 1; opacity: 0; transition: opacity 350ms ease 120ms; }
    .rm-node.on circle { transform: scale(1); opacity: 1; }
    .rm-node.on .bar { opacity: 1; }
    .rm-node.end circle { display: none; }

    /* bottom-right: checklist */
    .checklist { position: absolute; left: 48px; right: 48px; top: 40px; display: flex; flex-direction: column; gap: 22px; }
    .item { display: flex; align-items: center; gap: 14px; }
    .cb { flex-shrink: 0; width: 24px; height: 24px; display: grid; place-items: center; border: 1.8px solid var(--loader-line); border-radius: 8px; transition: background 250ms ease, border-color 250ms ease; }
    .cb svg { width: 15px; height: 15px; fill: none; stroke: #000; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 18; stroke-dashoffset: 18; transition: stroke-dashoffset 300ms ease 100ms; }
    .item .line { height: 12px; border: 1px solid var(--loader-line); border-radius: 6px; background: var(--loader-skeleton); transition: background 300ms ease; }
    .item:nth-child(1) .line { width: 62%; }
    .item:nth-child(2) .line { width: 48%; }
    .item:nth-child(3) .line { width: 72%; }
    .item:nth-child(4) .line { width: 40%; }
    .item.active .cb { border-color: var(--lime); animation: pulse 900ms ease-in-out infinite; }
    .item.done .cb { background: var(--lime); border-color: var(--lime); animation: none; }
    .item.done .cb svg { stroke-dashoffset: 0; }
    .item.done .line { background: var(--fade); opacity: 0.5; }
    .progress { position: absolute; left: 48px; right: 48px; bottom: 32px; height: 6px; border: 1px solid var(--loader-line); border-radius: 6px; background: var(--loader-skeleton); overflow: hidden; }
    .progress i { display: block; height: 100%; width: 0; background: var(--lime); border-radius: 6px; transition: width 500ms var(--motion-ease); }
    @keyframes pulse { 50% { opacity: 0.45; } }

    .status #dots { color: var(--lime); }
    .status { margin: 0; font-size: 18px; line-height: 28px; text-align: center; }
    @media (prefers-reduced-motion: reduce) {
      .grid .box, .grid, .panel, .inner { transition: none; }
      .stage[data-play="tl"] .build-content { animation: none; }
      .rain-icon { animation-duration: 1ms; opacity: 0.8; transform: translateY(110px); }
    }
  </style>
</head>

      const stage = document.getElementById('stage');
      const boxes = document.querySelectorAll('.grid .box');
      const message = document.getElementById('message');
      const dots = document.getElementById('dots');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const ZOOM_MS = 900;

      // ---------- bottom-left: logo rain (every logo once, 4 per wave) ----------
      const rainEl = document.getElementById('rain');
      const lanes = [8, 31, 54, 76];
      let queue = [], rainTimer = null;
      const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
      function spawnWave() {
        if (reducedMotion.matches) return;
        shuffle(lanes.slice()).forEach((lane, i) => {
          if (!queue.length) queue = shuffle(ICONS.slice());
          const icon = queue.pop();
          const svg = document.createElementNS(NS, 'svg');
          svg.setAttribute('viewBox', '0 0 24 24');
          svg.setAttribute('class', 'rain-icon');
          const p = document.createElementNS(NS, 'path');
          p.setAttribute('d', icon.d);
          svg.appendChild(p);
          svg.style.left = (lane + Math.random() * 6) + '%';
          svg.style.animationDelay = (i * 220 + Math.random() * 120) + 'ms';
          svg.addEventListener('animationend', () => svg.remove());
          rainEl.appendChild(svg);
        });
      }
      function stopRain() { clearInterval(rainTimer); rainTimer = null; }
      function startRain() {
        stopRain(); rainEl.innerHTML = '';
        queue = shuffle(ICONS.slice());
        const total = Math.ceil(ICONS.length / lanes.length);
        let n = 1;
        spawnWave();
        rainTimer = setInterval(() => { if (n < total) { spawnWave(); n++; } else stopRain(); }, 1100);
      }

      // ---------- top-right: roadmap (curved path + arrow) ----------
      const rmLine = document.getElementById('rm-line');
      const rmArrow = document.getElementById('rm-arrow');
      const rmNodesG = document.getElementById('rm-nodes');
      const rmLen = rmLine.getTotalLength();
      const rmNodes = [0, 0.36, 0.68, 1].map((f, i) => {
        const p = rmLine.getPointAtLength(rmLen * f);
        const g = document.createElementNS(NS, 'g');
        g.setAttribute('class', i === 3 ? 'rm-node end' : 'rm-node');
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 7);
        g.appendChild(c);
        [[70, 0], [44, 1]].forEach(([w, row]) => {
          const r = document.createElementNS(NS, 'rect');
          const below = i === 0 || i === 3;
          const x = i === 0 ? p.x - 7 : i === 3 ? p.x + 7 - w : p.x - 16 - w;
          const y = below ? p.y + 16 + row * 11 : p.y - 9 + row * 12;
          r.setAttribute('x', x); r.setAttribute('y', y); r.setAttribute('width', w); r.setAttribute('height', 6); r.setAttribute('rx', 3);
          r.setAttribute('class', 'bar');
          g.appendChild(r);
        });
        rmNodesG.appendChild(g);
        return { g, f };
      });
      let rmRaf = 0;
      function rmDraw(e) {
        const len = rmLen * e;
        rmLine.style.strokeDasharray = rmLen;
        rmLine.style.strokeDashoffset = rmLen - len;
        const a = rmLine.getPointAtLength(Math.max(len - 1, 0));
        const b = rmLine.getPointAtLength(Math.min(len + 1, rmLen));
        const p = rmLine.getPointAtLength(len);
        rmArrow.setAttribute('transform', `translate(${p.x} ${p.y}) rotate(${Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI})`);
        rmArrow.style.opacity = e > 0 ? 1 : 0;
        rmNodes.forEach(n => n.g.classList.toggle('on', e > 0 && e >= n.f - 0.001));
      }
      function rmStart() {
        cancelAnimationFrame(rmRaf);
        if (reducedMotion.matches) { rmDraw(1); return; }
        rmDraw(0);
        const dur = 2800, t0 = performance.now();
        const tick = now => {
          const t = Math.min((now - t0) / dur, 1);
          rmDraw(t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
          if (t < 1) rmRaf = requestAnimationFrame(tick);
        };
        rmRaf = requestAnimationFrame(tick);
      }

      // ---------- bottom-right: checklist ticking off ----------
      const items = [...document.querySelectorAll('#checklist .item')];
      const progress = document.getElementById('progress');
      let timers = [];
      const later = (fn, ms) => timers.push(setTimeout(fn, ms));
      function resetChecklist() {
        items.forEach(i => i.classList.remove('active', 'done'));
        progress.style.width = '0';
      }
      function startChecklist() {
        resetChecklist();
        if (reducedMotion.matches) { items.forEach(i => i.classList.add('done')); progress.style.width = '100%'; return; }
        items[0].classList.add('active');
        items.forEach((item, i) => later(() => {
          item.classList.remove('active'); item.classList.add('done');
          progress.style.width = ((i + 1) / items.length * 100) + '%';
          if (items[i + 1]) items[i + 1].classList.add('active');
        }, 600 + i * 700));
      }

      // ---------- sequence ----------
      const think = sizes => ({ kind: 'think', sizes, duration: 1300, msg: 'Thinking' });
      const section = (q, msg, duration) => [
        { kind: 'regrid', sizes: [1, 1, 1, 1], duration: 900, msg },
        { kind: 'zoom', q, duration, msg },
      ];
      const phases = [
        think([1, 1, 1, 1]), think([2.4, 1, 1, 1]), think([1, 2.4, 1, 1]), think([1, 2.4, 2.4, 1]),
        ...section('tl', 'Building your idea', ZOOM_MS + 3300),
        ...section('bl', 'Gathering your sources', ZOOM_MS + 7600),
        ...section('tr', 'Mapping your roadmap', ZOOM_MS + 3600),
        ...section('br', 'Working out the details', ZOOM_MS + 3500),
      ];
      const starters = { bl: startRain, tr: rmStart, br: startChecklist, tl: () => {} };
      let step = 0, dotCount = 1;
      function render() {
        const phase = phases[step];
        timers.forEach(clearTimeout); timers = [];
        const zoomed = phase.kind === 'zoom';
        stage.classList.toggle('is-zoom', zoomed);
        stage.dataset.zoom = zoomed ? phase.q : '';
        if (phase.sizes) boxes.forEach((box, i) => { box.style.flexGrow = phase.sizes[i]; });
        if (zoomed) {
          // reset this section, let the box finish growing, then play its animation
          stage.dataset.play = '';
          stopRain(); rainEl.innerHTML = ''; cancelAnimationFrame(rmRaf); rmDraw(0); resetChecklist();
          later(() => { stage.dataset.show = phase.q; stage.dataset.play = phase.q; starters[phase.q](); }, ZOOM_MS);
        } else {
          stage.dataset.show = '';
          stopRain();
        }
        message.textContent = phase.msg;
        setTimeout(() => { step = (step + 1) % phases.length; render(); }, phase.duration);
      }
      rmDraw(0);
      render();
      setInterval(() => {
        if (reducedMotion.matches) return;
        dotCount = (dotCount % 3) + 1;
        dots.textContent = '.'.repeat(dotCount);
      }, 400);
    })();
